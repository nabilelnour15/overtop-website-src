# Builds the site in website/ on every push to main and publishes the built files to the
# public nabilelnour15/overtop-website repo, which serves them on GitHub Pages.
# This source repo is private; publishing needs a write deploy key on the public repo whose
# private half is stored here as the PAGES_DEPLOY_KEY secret. Without it the build still runs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Publish to the public repo
        if: env.PAGES_DEPLOY_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$PAGES_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cd website/dist
          touch .nojekyll
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish built site from overtop-website-src@${GITHUB_SHA::7}"
          git push --force git@github.com:nabilelnour15/overtop-website.git main
